
version: 2.1

# ==========================================
# ORBS - Reusable CircleCI components
# ==========================================
orbs:
  snyk: snyk/snyk@2.3.0

jobs:

  # ==========================================
  # SNYK SCAN JOB - SCA (Maven dependencies)
  # ==========================================
  snyk_scan:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - snyk/scan:
          severity-threshold: high
          cli-version: 1.1308.1
          monitor-on-build: false

  # ==========================================
  # SNYK CODE JOB - SAST (Java source code)
  # ==========================================
  snyk_code:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - snyk/scan:
          command: code test
          severity-threshold: high
          cli-version: 1.1308.1
          monitor-on-build: false

  # ==========================================
  # BUILD JOB - Compile and package
  # ==========================================
  build:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Install dependencies and build
          command: |
            echo "Building the application..."
            mvn clean install -DskipTests

      - save_cache:
          paths:
            - ~/.m2
          key: maven-deps-{{ checksum "pom.xml" }}

      - persist_to_workspace:
          root: .
          paths:
            - target/*.jar

  # ==========================================
  # TEST JOB - Run automated tests
  # ==========================================
  test:
    docker:
      - image: cimg/openjdk:21.0

    steps:
      - checkout

      - restore_cache:
          keys:
            - maven-deps-{{ checksum "pom.xml" }}
            - maven-deps-

      - run:
          name: Run tests
          command: |
            echo "Running tests..."
            mvn test

      - store_test_results:
          path: target/surefire-reports

      - store_artifacts:
          path: target/surefire-reports

  # ==========================================
  # PUBLISH JOB - Build and push Docker image
  # ==========================================
  publish:
    docker:
      - image: cimg/base:stable

    steps:
      - checkout

      - attach_workspace:
          at: .

      - setup_remote_docker

      - run:
          name: Build Docker image
          command: |
            echo "Building Docker image..."
            docker build -t $DOCKER_USERNAME/devops-demo:latest .

      - run:
          name: Push to Docker Hub
          command: |
            echo "Logging in to Docker Hub..."
            echo "$DOCKER_TOKEN" | docker login -u "$DOCKER_USERNAME" --password-stdin
            echo "Pushing image to Docker Hub..."
            docker push "$DOCKER_USERNAME/devops-demo:latest"

  # ==========================================
  # DEPLOY JOB - Deploy Docker image to Render
  # ==========================================
  deploy:
    docker:
      - image: cimg/base:stable

    steps:
      - run:
          name: Install the Render CLI
          command: |
            set -e
            curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

      - run:
          name: Redeploy latest image on Render and wait
          command: |
            render deploys create "$RENDER_SERVICE_ID" \
              --wait --confirm --output text

  # ==========================================
  # NOTIFY JOB - Discord deployment results
  # ==========================================
  notify:
    parameters:
      result:
        type: enum
        enum: ["success", "failed"]

    docker:
      - image: cimg/base:stable

    steps:
      - run:
          name: Send the deployment result to Discord
          command: |
            if [ "<< parameters.result >>" = "success" ]; then
              MESSAGE="Deployment succeeded!"
            else
              MESSAGE="Deployment FAILED!"
            fi
            curl --fail --silent --show-error \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"${MESSAGE}\"}" \
              "$DISCORD_WEBHOOK_URL"

# ==========================================
# WORKFLOW - Security gates before release
# ==========================================
workflows:
  build_test_scan_publish_deploy:
    jobs:
      - build

      - snyk_scan

      - snyk_code

      - test:
          requires:
            - build

      - publish:
          context: docker-hub
          requires:
            - test
            - snyk_scan
            - snyk_code

      - deploy:
          requires:
            - publish

      - notify:
          name: notify-success
          result: success
          requires:
            - deploy: success

      - notify:
          name: notify-failure
          result: failed
          requires:
            - deploy: failed
